name: Produce reviewed token-scope blob once
on:
  push:
    branches: [ops/token-scope-patch-23-once]
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'StartupBros-com/shared-workflows'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          ref: 89c3ade6798653406bf40b6a014e168212295c6a
          persist-credentials: false
      - name: Produce blob only; never update a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import copy
          import difflib
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request
          import yaml

          path = Path('.github/workflows/dependency-autopilot.yml')
          old = path.read_bytes()
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob_sha(old) == '594ba287601c2355b8a37fc4d6d99488c5ed3973'
          assert len(old) == 97583 and old.endswith(b'\n')
          needle = b'          private-key: $' + b'{{ secrets.APP_PRIVATE_KEY }}\n'
          addition = (
              b'          # Contents publishes the repair; PR write covers PR metadata and labels.\n'
              b'          # Keep the default caller-repository scope and post-job revocation.\n'
              b'          permission-contents: write\n'
              b'          permission-pull-requests: write\n'
          )
          assert old.count(needle) == 1
          new = old.replace(needle, needle + addition, 1)
          before, after = yaml.safe_load(old), yaml.safe_load(new)
          expected = copy.deepcopy(before)
          app = next(s for s in expected['jobs']['autofix']['steps'] if s.get('id') == 'app')
          app['with'].update({'permission-contents': 'write', 'permission-pull-requests': 'write'})
          assert after == expected
          assert new.replace(addition, b'', 1) == old
          assert new.count(b'\n') == old.count(b'\n') + 4
          assert b'truncated-by' not in new
          print(''.join(difflib.unified_diff(old.decode().splitlines(True), new.decode().splitlines(True), fromfile='original', tofile='reviewed')), flush=True)
          assert os.environ['GITHUB_REPOSITORY'] == 'StartupBros-com/shared-workflows'
          payload = json.dumps({'content': new.decode('utf-8'), 'encoding': 'utf-8'}).encode()
          request = urllib.request.Request(
              'https://api.github.com/repos/StartupBros-com/shared-workflows/git/blobs',
              data=payload,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['sha'] == blob_sha(new)
          print('REVIEWED_BLOB=' + result['sha'])
          print('REVIEWED_BYTES=' + str(len(new)))
          print('REVIEWED_SHA256=' + hashlib.sha256(new).hexdigest())
          PY
