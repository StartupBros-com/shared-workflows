name: CI

# Keep the historical classifier fixtures and exercise the reusable workflow's
# actual shell blocks, including producer-to-handoff transitions.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          persist-credentials: false

      - name: Classifier fixtures
        run: bash tests/classify-tier.test.sh

      - name: Executable workflow tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Workflows parse as YAML
        run: |
          for wf in .github/workflows/*.yml; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$wf" \
              || { echo "::error::$wf is not valid YAML"; exit 1; }
            echo "ok - $wf"
          done
