name: Dependency Autopilot (reusable)

# Centralized dependency loop, called by a thin workflow_run stub in each repo.
# Green PRs are classified and queued as before. Review-tier green PRs and
# unresolved red PRs are handed to the existing pro-review daemon only after
# their producer finishes and the PR identity, provenance, head, and ownership
# are revalidated.

on:
  workflow_call:
    inputs:
      ci_conclusion:
        description: "Conclusion of the triggering CI run (success|failure|...)"
        required: true
        type: string
      pr_branch:
        description: "head_branch from the workflow_run event"
        required: true
        type: string
      ci_run_id:
        description: "Triggering pull_request CI run id"
        required: true
        type: string
      ecosystem:
        description: "pnpm | npm | pip — selects the auto-fix toolchain"
        required: false
        default: "pnpm"
        type: string
      mode:
        description: "queue (label only, default) | automerge (merge safe bumps)"
        required: false
        default: "queue"
        type: string
      runner:
        description: >-
          runs-on label for producer jobs. Public callers keep the default;
          private callers may pass their approved self-hosted runner label.
        required: false
        default: "ubuntu-latest"
        type: string
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      CODEX_AUTH:
        required: false

# A single concurrency group serializes triage, autofix, and terminal handoff
# runs for the same caller PR branch so they do not race one another. queue:max
# retains up to 100 pending runs and starts them FIFO by when they enter the
# queue, preventing a late stale event from replacing the current-head run.
concurrency:
  group: dependency-autopilot-${{ github.repository }}-${{ inputs.pr_branch }}
  queue: max
  cancel-in-progress: false

jobs:
  # ---------------- TRIAGE (CI green): classify risk, label, optionally merge ----------------
  triage:
    if: ${{ inputs.ci_conclusion == 'success' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 8
    outputs:
      outcome: ${{ steps.triage.outputs.outcome }}
      number: ${{ steps.triage.outputs.number }}
      trigger_sha: ${{ steps.triage.outputs.trigger_sha }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Classify a genuine dep-bot PR and label (merge only in automerge mode)
        id: triage
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.pr_branch }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          echo "outcome=failed_execution" >> "$GITHUB_OUTPUT"
          stop() {
            echo "::notice::$2"
            echo "outcome=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          prs_file="$RUNNER_TEMP/triage-prs.json"
          run_file="$RUNNER_TEMP/triage-run.json"
          runs_file="$RUNNER_TEMP/triage-runs.json"
          gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,author,assignees,reviewRequests,baseRefName,headRefName,headRefOid,isCrossRepository,isDraft,labels,state,title > "$prs_file"
          count=$(jq 'length' "$prs_file")
          [ "$count" = "1" ] || stop stale_rejected "expected one open PR for '$BRANCH', found $count; skipping."

          num=$(jq -r '.[0].number' "$prs_file")
          author=$(jq -r '.[0].author.login // ""' "$prs_file")
          is_bot=$(jq -r '.[0].author.is_bot // false' "$prs_file")
          xrepo=$(jq -r '.[0].isCrossRepository' "$prs_file")
          base=$(jq -r '.[0].baseRefName // ""' "$prs_file")
          head_branch=$(jq -r '.[0].headRefName // ""' "$prs_file")
          pr_sha=$(jq -r '.[0].headRefOid // ""' "$prs_file")
          title=$(jq -r '.[0].title' "$prs_file")
          norm="${author#app/}"; norm="${norm%\[bot\]}"
          { echo "number=$num"; echo "trigger_sha=$pr_sha"; } >> "$GITHUB_OUTPUT"

          [ "$is_bot" = "true" ] || stop stale_rejected "author '$author' is not a bot/app; skipping."
          case "$norm" in dependabot|startupbros-autopilot) : ;; *) stop stale_rejected "author '$author' is not a trusted dependency bot; skipping." ;; esac
          [ "$xrepo" = "false" ] || stop stale_rejected "cross-repository PR; skipping."
          [ "$base" = "main" ] || stop stale_rejected "base must be main, got '$base'; skipping."
          [ "$head_branch" = "$BRANCH" ] || stop stale_rejected "PR head branch no longer matches the trigger; skipping."
          [ -n "$pr_sha" ] || stop stale_rejected "PR head SHA is missing; skipping."
          [ "$(jq -r '.[0].isDraft // false' "$prs_file")" = "false" ] || stop existing_owner "PR #$num is a draft; leaving it to its author."

          for owner_label in pro-review skip-pro-review claimed loop-run; do
            if jq -e --arg label "$owner_label" 'any(.[0].labels[]?; .name == $label)' "$prs_file" >/dev/null; then
              stop existing_owner "PR #$num already carries '$owner_label'; leaving it to its current owner."
            fi
          done
          human_assignees=$(jq '[.[0].assignees[]? | select((.is_bot // false) != true)] | length' "$prs_file")
          [ "$human_assignees" = "0" ] || stop existing_owner "PR #$num has a human assignee; leaving it to that owner."
          pending_reviews=$(jq '.[0].reviewRequests // [] | length' "$prs_file")
          [ "$pending_reviews" = "0" ] || stop existing_owner "PR #$num has a pending review request; leaving it to that owner."

          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json event,headSha,url > "$run_file"
          run_event=$(jq -r '.event // ""' "$run_file")
          run_sha=$(jq -r '.headSha // ""' "$run_file")
          [ "$run_event" = "pull_request" ] || stop stale_rejected "run $RUN_ID is not pull_request provenance; skipping."
          [ -n "$run_sha" ] || stop stale_rejected "run $RUN_ID has no head SHA; skipping."
          [ "$run_sha" = "$pr_sha" ] || stop stale_rejected "run $RUN_ID was for $run_sha but PR #$num is now $pr_sha; skipping."

          # Take only the latest run per workflow, across every page (a repo
          # can have more than 100 workflow runs at this head SHA). API
          # failure is not green, and an empty run inventory is not green
          # either — it means CI evidence is missing, not that it passed.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$pr_sha&event=pull_request&per_page=100" \
            --paginate --slurp > "$runs_file"
          latest=$(jq '[ .[] | .workflow_runs[] ] | group_by(.workflow_id) | map(max_by(.run_number))' "$runs_file")
          total=$(jq 'length' <<<"$latest")
          bad=$(jq '[ .[] | (.conclusion // "pending") ]
                    | map(select(. != "success" and . != "skipped" and . != "neutral")) | length' <<<"$latest")
          allgreen=1
          [ "$bad" -gt 0 ] && allgreen=0
          [ "$total" -eq 0 ] && allgreen=0

          # Keep this classifier in lockstep with tests/classify-tier.test.sh.
          tier="review"; reason="unclassified"
          if [[ "$BRANCH" == *"minor-and-patch"* || "$BRANCH" == *"github-actions"* || "$BRANCH" == *"github_actions"* ]]; then
            tier="safe"; reason="grouped minor/patch"
          elif [[ "$title" == *"[SECURITY]"* ]]; then
            tier="review"
            if [[ "$title" =~ @[^0-9]*([0-9]+)\.[0-9]+.*\ to\ \>?=?v?([0-9]+) ]]; then
              sfM="${BASH_REMATCH[1]}"; stM="${BASH_REMATCH[2]}"
              if [ "$sfM" != "$stM" ]; then
                reason="security advisory, major line ${sfM}.x -> ${stM}.x — human review"
              else
                reason="security advisory within ${sfM}.x — human review"
              fi
            else
              reason="security advisory — human review"
            fi
          elif [[ "$title" =~ from\ ([0-9]+)\.([0-9]+)\.[0-9]+.*to\ ([0-9]+)\.([0-9]+)\.[0-9]+ ]]; then
            fM="${BASH_REMATCH[1]}"; fm="${BASH_REMATCH[2]}"; tM="${BASH_REMATCH[3]}"; tm="${BASH_REMATCH[4]}"
            if [ "$fM" != "$tM" ]; then
              tier="review"; reason="major bump ${fM}.x -> ${tM}.x"
            elif [ "$fM" = "0" ] && [ "$fm" != "$tm" ]; then
              tier="review"; reason="0.x minor (${fM}.${fm} -> ${tM}.${tm}) — semver allows breaking"
            else
              tier="safe"; reason="single non-major bump"
            fi
          fi
          if [ "$allgreen" != "1" ]; then tier="review"; reason="${reason}; not all CI green"; fi
          if jq -e 'any(.[0].labels[]?; .name == "autopilot:autofixed")' "$prs_file" >/dev/null; then
            tier="review"; reason="contains AI-authored auto-fix — human review required"
          fi
          echo "tier=$tier reason=$reason allgreen=$allgreen mode=$MODE"

          fresh_file="$RUNNER_TEMP/triage-fresh.json"
          gh pr view "$num" --repo "$GITHUB_REPOSITORY" \
            --json number,author,assignees,reviewRequests,baseRefName,headRefName,headRefOid,isCrossRepository,isDraft,labels,state,title > "$fresh_file"
          jq -e --slurpfile fresh "$fresh_file" '.[0] == $fresh[0]' "$prs_file" >/dev/null \
            || stop stale_rejected "PR #$num changed during classification; leaving it for the current owner or next run."

          gh label create "autopilot:ready" --repo "$GITHUB_REPOSITORY" \
            --color 0e8a16 --description "Autopilot: CI green + low risk — safe to merge" \
            || gh api "repos/$GITHUB_REPOSITORY/labels/autopilot:ready" --silent
          gh label create "autopilot:review" --repo "$GITHUB_REPOSITORY" \
            --color fbca04 --description "Autopilot: held for review before merge" \
            || gh api "repos/$GITHUB_REPOSITORY/labels/autopilot:review" --silent

          if [ "$tier" = "safe" ]; then
            gh pr edit "$num" --repo "$GITHUB_REPOSITORY" --add-label "autopilot:ready" --remove-label "autopilot:review"
            if [ "$MODE" = "automerge" ]; then
              gh pr merge "$num" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$pr_sha"
            else
              echo "::notice::queue mode — #$num is ready ($reason)."
            fi
            outcome="green_safe"
          else
            gh pr edit "$num" --repo "$GITHUB_REPOSITORY" --add-label "autopilot:review" --remove-label "autopilot:ready"
            if [ "$allgreen" = "1" ]; then
              echo "::notice::#$num is held for review ($reason)."
              outcome="review_held"
            else
              echo "::notice::#$num remains held while sibling CI is unresolved ($reason)."
              outcome="ci_unresolved"
            fi
          fi
          { echo "tier=$tier"; echo "outcome=$outcome"; } >> "$GITHUB_OUTPUT"

  # ---------------- AUTO-FIX (CI red): bounded application-code repair ----------------
  # Failure-like conclusions kept in lockstep with the handoff's shell case
  # below (tests/test_dependency_autopilot.py asserts both stay in sync).
  # cancelled, neutral, and skipped are deliberately excluded: they are not
  # unresolved red work.
  autofix:
    if: ${{ contains(fromJSON('["failure","timed_out","action_required","startup_failure"]'), inputs.ci_conclusion) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
      number: ${{ steps.pre.outputs.number }}
      trigger_sha: ${{ steps.pre.outputs.trigger_sha }}
      pushed_sha: ${{ steps.push.outputs.pushed_sha }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Validate PR identity, ownership, provenance, and credentials
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_AUTH: ${{ secrets.CODEX_AUTH }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          BRANCH: ${{ inputs.pr_branch }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          echo "outcome=failed_execution" >> "$GITHUB_OUTPUT"
          stop() {
            echo "::notice::$2"
            echo "outcome=$1" >> "$GITHUB_OUTPUT"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          }

          prs_file="$RUNNER_TEMP/autofix-prs.json"
          run_file="$RUNNER_TEMP/autofix-run.json"
          gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,author,assignees,reviewRequests,baseRefName,headRefName,headRefOid,isCrossRepository,isDraft,labels,state > "$prs_file"
          count=$(jq 'length' "$prs_file")
          [ "$count" = "1" ] || stop stale_rejected "expected one open PR for '$BRANCH', found $count; skipping auto-fix."

          num=$(jq -r '.[0].number' "$prs_file")
          author=$(jq -r '.[0].author.login // ""' "$prs_file")
          is_bot=$(jq -r '.[0].author.is_bot // false' "$prs_file")
          norm="${author#app/}"; norm="${norm%\[bot\]}"
          xrepo=$(jq -r '.[0].isCrossRepository' "$prs_file")
          base=$(jq -r '.[0].baseRefName // ""' "$prs_file")
          head_branch=$(jq -r '.[0].headRefName // ""' "$prs_file")
          pr_sha=$(jq -r '.[0].headRefOid // ""' "$prs_file")
          { echo "number=$num"; echo "trigger_sha=$pr_sha"; } >> "$GITHUB_OUTPUT"

          [ "$is_bot" = "true" ] || stop stale_rejected "author '$author' is not a bot/app; skipping auto-fix."
          case "$norm" in dependabot|startupbros-autopilot) : ;; *) stop stale_rejected "author '$author' is not a trusted dependency bot; skipping auto-fix." ;; esac
          [ "$xrepo" = "false" ] || stop stale_rejected "cross-repository PR; skipping auto-fix."
          [ "$base" = "main" ] || stop stale_rejected "base must be main, got '$base'; skipping auto-fix."
          [ "$head_branch" = "$BRANCH" ] || stop stale_rejected "PR head branch no longer matches the trigger; skipping auto-fix."
          [ -n "$pr_sha" ] || stop stale_rejected "PR head SHA is missing; skipping auto-fix."
          [ "$(jq -r '.[0].isDraft // false' "$prs_file")" = "false" ] || stop existing_owner "PR #$num is a draft; leaving it to its author."

          for owner_label in pro-review skip-pro-review claimed loop-run; do
            if jq -e --arg label "$owner_label" 'any(.[0].labels[]?; .name == $label)' "$prs_file" >/dev/null; then
              stop existing_owner "PR #$num already carries '$owner_label'; skipping auto-fix."
            fi
          done
          human_assignees=$(jq '[.[0].assignees[]? | select((.is_bot // false) != true)] | length' "$prs_file")
          [ "$human_assignees" = "0" ] || stop existing_owner "PR #$num has a human assignee; skipping auto-fix."
          pending_reviews=$(jq '.[0].reviewRequests // [] | length' "$prs_file")
          [ "$pending_reviews" = "0" ] || stop existing_owner "PR #$num has a pending review request; skipping auto-fix."

          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json event,headSha,url > "$run_file"
          run_event=$(jq -r '.event // ""' "$run_file")
          run_sha=$(jq -r '.headSha // ""' "$run_file")
          [ "$run_event" = "pull_request" ] || stop stale_rejected "run $RUN_ID is not pull_request provenance; skipping auto-fix."
          [ -n "$run_sha" ] || stop stale_rejected "run $RUN_ID has no head SHA; skipping auto-fix."
          [ "$run_sha" = "$pr_sha" ] || stop stale_rejected "stale failure: run $RUN_ID was for $run_sha but PR #$num is now $pr_sha."

          if [ -z "${CODEX_AUTH:-}" ] || [ -z "${APP_ID:-}" ] || [ -z "${APP_PRIVATE_KEY:-}" ]; then
            stop unavailable_credentials "Auto-fix credentials are unavailable; terminal handoff will consider the unresolved red PR."
          fi

          echo "Validated dependency PR #$num at $pr_sha."
          { echo "ok=1"; echo "outcome=admitted"; } >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch (no persisted creds)
        if: steps.pre.outputs.ok == '1'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.pr_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        if: ${{ steps.pre.outputs.ok == '1' && inputs.ecosystem == 'pnpm' }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          dest: ~/setup-pnpm-autopilot
      - name: Setup Node
        if: ${{ steps.pre.outputs.ok == '1' && (inputs.ecosystem == 'pnpm' || inputs.ecosystem == 'npm') }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
      - name: Setup uv (Python)
        if: ${{ steps.pre.outputs.ok == '1' && inputs.ecosystem == 'pip' }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Codex CLI (pinned)
        if: steps.pre.outputs.ok == '1'
        run: |
          npm install -g @openai/codex@0.142.4
          codex --version

      - name: Restore Codex subscription auth
        if: steps.pre.outputs.ok == '1'
        env:
          CODEX_AUTH: ${{ secrets.CODEX_AUTH }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"

      - name: Codex — fix from the failed CI logs
        if: steps.pre.outputs.ok == '1'
        id: codex
        # Shorter than the job's 30-minute timeout so a hang still leaves
        # budget for the always()-run "Record auto-fix outcome" step below.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/failed-ci.log"
          last_file="$RUNNER_TEMP/codex-last.txt"
          if ! gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$log_file"; then
            echo "outcome=failed_execution" >> "$GITHUB_OUTPUT"
            echo "::error::failed to fetch logs for run $RUN_ID"
            exit 1
          fi
          if [ ! -s "$log_file" ]; then
            echo "outcome=failed_execution" >> "$GITHUB_OUTPUT"
            echo "::error::no failed logs for run $RUN_ID"
            exit 1
          fi
          echo "Fetched $(wc -l < "$log_file") lines of failed CI logs."

          set +e
          codex exec \
            --sandbox workspace-write \
            --skip-git-repo-check \
            -c model_provider=openai \
            -o "$last_file" \
            "The failed CI logs for this dependency-update PR are on stdin. You ARE in the checked-out repo working tree — read and edit the source files directly. Make the MINIMAL application-code changes needed for compatibility with the new dependency versions so the build and tests pass. Do NOT change dependency versions, lockfiles, package.json/pyproject.toml, or workflow files. Do NOT refactor unrelated code. Prefer editing source over running installs. If you genuinely cannot fix it, stop and explain why." < "$log_file"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "----- codex final message -----"
          if [ -f "$last_file" ]; then cat "$last_file"; fi
          if [ "$rc" -ne 0 ]; then
            echo "outcome=failed_execution" >> "$GITHUB_OUTPUT"
            echo "::error::Codex exited $rc"
            exit "$rc"
          fi
          echo "outcome=codex_succeeded" >> "$GITHUB_OUTPUT"

      - name: Guard changed files
        if: ${{ steps.pre.outputs.ok == '1' && steps.codex.outcome == 'success' }}
        id: guard
        run: |
          set -euo pipefail
          changed_file="$RUNNER_TEMP/changed.txt"
          {
            # --no-renames: a collapsed rename reports only the destination,
            # which would hide a staged move away from a protected source
            # (e.g. `git mv package.json src/package.ts`).
            git diff --name-only --no-renames HEAD
            git ls-files --others --exclude-standard
          } | sort -u > "$changed_file"
          echo "Changed files:"
          if [ -s "$changed_file" ]; then cat "$changed_file"; fi
          if [ ! -s "$changed_file" ]; then
            echo "::notice::Codex produced no changes."
            echo "outcome=no_changes" >> "$GITHUB_OUTPUT"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -E '(^|/)(pnpm-lock\.yaml|pnpm-workspace\.yaml|package-lock\.json|yarn\.lock|bun\.lock|package\.json|pyproject\.toml|uv\.lock|poetry\.lock)$|^\.github/workflows/' "$changed_file"; then
            echo "outcome=failed_execution" >> "$GITHUB_OUTPUT"
            echo "::error::Codex touched dependency, lockfile, or workflow files; refusing to commit."
            exit 1
          fi
          echo "outcome=changes_ready" >> "$GITHUB_OUTPUT"
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Mint a short-lived GitHub App token (scoped to this repo)
        if: ${{ steps.pre.outputs.ok == '1' && steps.guard.outputs.changed == '1' }}
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Hold the PR for review before publishing an AI fix
        if: ${{ steps.pre.outputs.ok == '1' && steps.guard.outputs.changed == '1' }}
        id: flag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NUM: ${{ steps.pre.outputs.number }}
          TRIGGER_SHA: ${{ steps.pre.outputs.trigger_sha }}
          BRANCH: ${{ inputs.pr_branch }}
        run: |
          set -euo pipefail
          fresh_file="$RUNNER_TEMP/before-push.json"
          gh pr view "$NUM" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,state,isDraft,labels,assignees,reviewRequests,baseRefName,headRefName > "$fresh_file"
          # Recheck the same base/branch trust invariant admission and the
          # terminal handoff enforce: a retarget away from main while Codex
          # is running must not reach the label/push below.
          if ! jq -e --arg sha "$TRIGGER_SHA" --arg branch "$BRANCH" \
               '.headRefOid == $sha and .state == "OPEN" and .isDraft == false and .baseRefName == "main" and .headRefName == $branch' \
               "$fresh_file" >/dev/null; then
            echo "outcome=stale_rejected" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if jq -e 'any(.labels[]?; .name | IN("pro-review", "skip-pro-review", "claimed", "loop-run")) or
                    any(.assignees[]?; (.is_bot // false) != true) or
                    ((.reviewRequests // []) | length > 0)' "$fresh_file" >/dev/null; then
            echo "outcome=existing_owner" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Hold before pushing: a failed label write must not leave AI changes
          # eligible for the existing automerge path. A failed push keeps the hold.
          gh label create "autopilot:autofixed" --repo "$GITHUB_REPOSITORY" \
            --color d93f0b --description "Autopilot: AI fix attempted — review before merge" \
            || gh api "repos/$GITHUB_REPOSITORY/labels/autopilot:autofixed" --silent
          gh pr edit "$NUM" --repo "$GITHUB_REPOSITORY" --add-label "autopilot:autofixed"
          echo "flagged=1" >> "$GITHUB_OUTPUT"

      - name: Commit and push the fix (re-triggers CI)
        if: ${{ steps.pre.outputs.ok == '1' && steps.guard.outputs.changed == '1' && steps.flag.outputs.flagged == '1' }}
        id: push
        env:
          PUSH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ inputs.pr_branch }}
          TRIGGER_SHA: ${{ steps.pre.outputs.trigger_sha }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BRANCH"
          remote_sha=$(git rev-parse "origin/$BRANCH")
          if [ "$remote_sha" != "$TRIGGER_SHA" ]; then
            echo "::notice::branch advanced ($TRIGGER_SHA -> $remote_sha); refusing a stale push."
            echo "outcome=stale_rejected" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "codex-autofix"
          git config user.email "codex-autofix@users.noreply.github.com"
          git --literal-pathspecs add --pathspec-from-file="$RUNNER_TEMP/changed.txt"
          git commit -m "fix(deps): Codex auto-fix for dependency breakage"
          pushed_sha=$(git rev-parse HEAD)
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"
          { echo "outcome=successful_push"; echo "pushed_sha=$pushed_sha"; } >> "$GITHUB_OUTPUT"
          echo "::notice::Pushed $pushed_sha via a short-lived GitHub App token; CI will re-run."

      - name: Record auto-fix outcome
        if: always()
        id: result
        env:
          PRE_OUTCOME: ${{ steps.pre.outputs.outcome }}
          CODEX_STATUS: ${{ steps.codex.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outputs.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outputs.outcome }}
          FLAG_STATUS: ${{ steps.flag.outcome }}
          FLAG_OUTCOME: ${{ steps.flag.outputs.outcome }}
          FLAGGED: ${{ steps.flag.outputs.flagged }}
        run: |
          set -euo pipefail
          case "$PRE_OUTCOME" in
            unavailable_credentials|stale_rejected|existing_owner)
              outcome="$PRE_OUTCOME"
              ;;
            admitted)
              if [ "$CODEX_STATUS" = "failure" ] || [ "$GUARD_OUTCOME" = "failed_execution" ]; then
                outcome="failed_execution"
              elif [ "$GUARD_OUTCOME" = "no_changes" ]; then
                outcome="no_changes"
              elif [ "${FLAG_OUTCOME:-}" = "existing_owner" ]; then
                outcome="existing_owner"
              elif [ "$PUSH_OUTCOME" = "stale_rejected" ] || [ "${FLAG_OUTCOME:-}" = "stale_rejected" ]; then
                outcome="stale_rejected"
              elif [ "$PUSH_OUTCOME" = "successful_push" ] && [ "$FLAG_STATUS" = "success" ] && [ "$FLAGGED" = "1" ]; then
                outcome="successful_push"
              else
                outcome="failed_execution"
              fi
              ;;
            *) outcome="failed_execution" ;;
          esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "Auto-fix outcome: $outcome"

  # ---------------- TERMINAL HANDOFF: one owner after the producer finishes ----------------
  handoff:
    needs: [triage, autofix]
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Revalidate and queue the existing pro-review daemon
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.pr_branch }}
          RUN_ID: ${{ inputs.ci_run_id }}
          CI_CONCLUSION: ${{ inputs.ci_conclusion }}
          TRIAGE_RESULT: ${{ needs.triage.result }}
          TRIAGE_OUTCOME: ${{ needs.triage.outputs.outcome }}
          TRIAGE_NUMBER: ${{ needs.triage.outputs.number }}
          TRIAGE_TRIGGER_SHA: ${{ needs.triage.outputs.trigger_sha }}
          AUTOFIX_RESULT: ${{ needs.autofix.result }}
          AUTOFIX_OUTCOME: ${{ needs.autofix.outputs.outcome }}
          AUTOFIX_NUMBER: ${{ needs.autofix.outputs.number }}
          AUTOFIX_TRIGGER_SHA: ${{ needs.autofix.outputs.trigger_sha }}
          AUTOFIX_PUSHED_SHA: ${{ needs.autofix.outputs.pushed_sha }}
        run: |
          set -euo pipefail
          handoff_status="failed"
          detail="metadata or API validation failed"
          producer_outcome="unknown"
          num=""
          expected_sha=""
          trigger_sha=""
          run_url=""
          summarize() {
            rc=$?
            {
              echo "### Dependency autopilot"
              echo "- PR: ${num:-unknown}"
              echo "- Producer outcome: $producer_outcome"
              echo "- Handoff: $handoff_status"
              echo "- Detail: $detail"
            } >> "$GITHUB_STEP_SUMMARY"
            return "$rc"
          }
          trap summarize EXIT
          skip() {
            handoff_status="skipped"
            detail="$1"
            echo "::notice::$1"
            exit 0
          }
          fail() {
            detail="$1"
            echo "::error::$1"
            exit 1
          }

          if [ "$CI_CONCLUSION" = "success" ]; then
            producer_outcome="$TRIAGE_OUTCOME"
            [ "$TRIAGE_RESULT" = "success" ] || fail "triage did not finish successfully"
            case "$producer_outcome" in
              green_safe) skip "safe green PRs stay in the inexpensive ready queue" ;;
              review_held) : ;;
              ci_unresolved) skip "sibling CI is unresolved; defer to its watched completion event" ;;
              existing_owner) skip "an existing review or active owner already controls this PR" ;;
              stale_rejected) skip "triage rejected a stale or ineligible target" ;;
              *) fail "triage returned missing or failed outcome metadata" ;;
            esac
            num="$TRIAGE_NUMBER"
            trigger_sha="$TRIAGE_TRIGGER_SHA"
            expected_sha="$trigger_sha"
          elif [ "$CI_CONCLUSION" = "failure" ] || [ "$CI_CONCLUSION" = "timed_out" ] \
               || [ "$CI_CONCLUSION" = "action_required" ] || [ "$CI_CONCLUSION" = "startup_failure" ]; then
            producer_outcome="$AUTOFIX_OUTCOME"
            # A forced job termination (job-level timeout, lost runner) skips
            # the always()-run result step, so the outcome output is empty.
            # Only infer failed_execution when the job itself reports
            # "failure" (never "cancelled" — that is not unresolved repair
            # work) AND the producer already bound identity before it died;
            # a missing binding still falls through to the fail-closed case.
            if [ -z "$producer_outcome" ] && [ "$AUTOFIX_RESULT" = "failure" ] \
               && [ -n "$AUTOFIX_NUMBER" ] && [ -n "$AUTOFIX_TRIGGER_SHA" ]; then
              producer_outcome="failed_execution"
            fi
            case "$producer_outcome" in
              successful_push)
                [ "$AUTOFIX_RESULT" = "success" ] || fail "a pushed fix was not fully flagged"
                expected_sha="$AUTOFIX_PUSHED_SHA"
                ;;
              no_changes|unavailable_credentials)
                [ "$AUTOFIX_RESULT" = "success" ] || fail "unresolved auto-fix metadata is inconsistent"
                expected_sha="$AUTOFIX_TRIGGER_SHA"
                ;;
              existing_owner) skip "an existing review or active owner already controls this PR" ;;
              stale_rejected) skip "auto-fix rejected a stale or ineligible target" ;;
              failed_execution)
                # A failed repair is unresolved work, not a clean no-op. Only the
                # unchanged, independently revalidated PR is eligible below.
                expected_sha="$AUTOFIX_TRIGGER_SHA"
                ;;
              *) fail "auto-fix returned missing outcome metadata" ;;
            esac
            num="$AUTOFIX_NUMBER"
            trigger_sha="$AUTOFIX_TRIGGER_SHA"
          else
            # cancelled, neutral, skipped, and any other conclusion outside
            # the autofix job's own gate are deliberately not routed here.
            producer_outcome="not_applicable"
            skip "CI conclusion '$CI_CONCLUSION' has no handoff path"
          fi

          [ -n "$num" ] || fail "producer did not supply a PR number"
          [ -n "$trigger_sha" ] || fail "producer did not supply the triggering PR head"
          [ -n "$expected_sha" ] || fail "producer did not supply the expected terminal head"

          run_file="$RUNNER_TEMP/handoff-run.json"
          prs_file="$RUNNER_TEMP/handoff-prs.json"
          candidate_file="$RUNNER_TEMP/handoff-candidate.json"
          fresh_file="$RUNNER_TEMP/handoff-fresh.json"
          comments_file="$RUNNER_TEMP/handoff-comments.json"

          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json event,headSha,url > "$run_file"
          run_event=$(jq -r '.event // ""' "$run_file")
          run_sha=$(jq -r '.headSha // ""' "$run_file")
          run_url=$(jq -r '.url // ""' "$run_file")
          [ "$run_event" = "pull_request" ] || fail "triggering run is not pull_request provenance"
          [ -n "$run_sha" ] || fail "triggering run head SHA is missing"
          [ -n "$run_url" ] || fail "triggering run URL is missing"
          [ "$run_sha" = "$trigger_sha" ] || fail "producer provenance does not match the triggering run head"

          gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,author,assignees,reviewRequests,baseRefName,headRefName,headRefOid,isCrossRepository,isDraft,labels,state > "$prs_file"
          count=$(jq 'length' "$prs_file")
          [ "$count" = "1" ] || skip "target is closed, missing, or ambiguous"
          jq '.[0]' "$prs_file" > "$candidate_file"

          block_reason=""
          validate_target() {
            local file="$1" author is_bot norm xrepo base head_branch head_sha state human_assignees pending_reviews owner_label
            author=$(jq -r '.author.login // ""' "$file")
            is_bot=$(jq -r '.author.is_bot // false' "$file")
            norm="${author#app/}"; norm="${norm%\[bot\]}"
            xrepo=$(jq -r '.isCrossRepository' "$file")
            base=$(jq -r '.baseRefName // ""' "$file")
            head_branch=$(jq -r '.headRefName // ""' "$file")
            head_sha=$(jq -r '.headRefOid // ""' "$file")
            state=$(jq -r '.state // ""' "$file")
            [ "$is_bot" = "true" ] || { block_reason="author is not a bot/app"; return 1; }
            case "$norm" in dependabot|startupbros-autopilot) : ;; *) block_reason="author is not an allowlisted dependency bot"; return 1 ;; esac
            [ "$xrepo" = "false" ] || { block_reason="cross-repository target"; return 1; }
            [ "$base" = "main" ] || { block_reason="base is not main"; return 1; }
            [ "$head_branch" = "$BRANCH" ] || { block_reason="head branch changed"; return 1; }
            [ "$head_sha" = "$expected_sha" ] || { block_reason="head moved from expected $expected_sha to $head_sha"; return 1; }
            case "$state" in OPEN|open) : ;; *) block_reason="PR is not open"; return 1 ;; esac
            [ "$(jq -r '.isDraft // false' "$file")" = "false" ] || { block_reason="PR is a draft"; return 1; }
            for owner_label in pro-review skip-pro-review claimed loop-run; do
              if jq -e --arg label "$owner_label" 'any(.labels[]?; .name == $label)' "$file" >/dev/null; then
                block_reason="existing owner label '$owner_label'"
                return 1
              fi
            done
            human_assignees=$(jq '[.assignees[]? | select((.is_bot // false) != true)] | length' "$file")
            [ "$human_assignees" = "0" ] || { block_reason="human assignee already owns the PR"; return 1; }
            pending_reviews=$(jq '.reviewRequests // [] | length' "$file")
            [ "$pending_reviews" = "0" ] || { block_reason="pending review request already owns the PR"; return 1; }
          }

          candidate_num=$(jq -r '.number' "$candidate_file")
          [ "$candidate_num" = "$num" ] || skip "producer PR number no longer matches the branch target"
          if ! validate_target "$candidate_file"; then skip "$block_reason"; fi

          # Refresh before any mutation. PR labels are not an atomic SHA lease;
          # the consumer must still bind its effects to the head it actually reads.
          gh pr view "$num" --repo "$GITHUB_REPOSITORY" \
            --json number,state,author,assignees,reviewRequests,baseRefName,headRefName,headRefOid,isCrossRepository,isDraft,labels > "$fresh_file"
          if ! validate_target "$fresh_file"; then skip "$block_reason"; fi

          marker="<!-- dependency-autopilot-handoff:$expected_sha -->"
          gh api "repos/$GITHUB_REPOSITORY/issues/$num/comments?per_page=100" --paginate --slurp > "$comments_file"
          if ! jq -e --arg marker "$marker" '
                any(.[][]?;
                  .user.type == "Bot" and
                  .user.login == "github-actions[bot]" and
                  ((.body // "") | contains($marker)))
              ' "$comments_file" >/dev/null; then
            body=$(printf '%s\n%s\n%s\n%s\n%s' \
              "$marker" \
              "Requesting review for PR #$num at \`$expected_sha\`." \
              "Producer outcome: \`$producer_outcome\`." \
              "Source CI: $run_url" \
              "Next owner: the existing pro-review daemon once the pro-review label is present. This request is not a completed review or a merge; see the handoff job for enqueue failures.")
            gh pr comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
          gh label create "pro-review" --repo "$GITHUB_REPOSITORY" \
            --color 5319e7 --description "Existing pro-review daemon queue" \
            || gh api "repos/$GITHUB_REPOSITORY/labels/pro-review" --silent
          # Recheck after the audit write as well: a new author or head may have
          # arrived during API calls. Repeated events reuse the request above.
          gh pr view "$num" --repo "$GITHUB_REPOSITORY" \
            --json number,state,author,assignees,reviewRequests,baseRefName,headRefName,headRefOid,isCrossRepository,isDraft,labels > "$fresh_file"
          if ! validate_target "$fresh_file"; then skip "$block_reason"; fi
          gh pr edit "$num" --repo "$GITHUB_REPOSITORY" --add-label "pro-review"

          handoff_status="queued"
          detail="queued $expected_sha for the existing pro-review daemon; consumption is verified separately"
          echo "::notice::$detail"
